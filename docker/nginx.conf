server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Bez cache i bez sendfile: zmiana pliku .md jest widoczna po zwykłym odświeżeniu,
    # także gdy folder jest zamontowany z Windowsa.
    sendfile off;
    add_header Cache-Control "no-store" always;

    include /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;
    charset utf-8;

    location ~ /\. { deny all; }
}
