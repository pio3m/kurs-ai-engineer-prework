# Lokalny podgląd slajdów: docker compose up -d, potem http://localhost:8080/?m=module-0
services:
  slajdy:
    image: nginx:alpine
    container_name: kurs-prework-slajdy
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
